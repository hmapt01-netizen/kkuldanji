<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 페이지를 찾을 수 없습니다 | 꿀단지</title>
    <meta name="robots" content="noindex, follow">
        <!-- 🍯 꿀단지 공식 파비콘 풀세트 (무결점 가디언 자동 동기화) -->
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Noto Sans KR", sans-serif;
            background: #fffbeb;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .error-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #fed7aa;
            border-radius: 20px;
            padding: 48px 28px;
            box-shadow: 0 16px 36px rgba(245, 158, 11, 0.12);
        }
        .error-badge {
            display: inline-block;
            background: #fef3c7;
            color: #b45309;
            font-size: 0.82rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        .error-code {
            font-size: 4.8rem;
            font-weight: 900;
            line-height: 1;
            color: #d97706;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 1.35rem;
            font-weight: 850;
            color: #0f172a;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .error-desc {
            font-size: 0.95rem;
            color: #64748b;
            line-height: 1.65;
            margin-bottom: 28px;
            word-break: keep-all;
        }
        .btn-home {
            display: inline-block;
            background: #f59e0b;
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .btn-home:hover {
            background: #d97706;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <span class="error-badge">🍯 혀니의 꿀단지 매거진</span>
        <div class="error-code">404</div>
        <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
        <p class="error-desc">
            찾으시는 건강 칼럼의 주소가 변경되었거나 삭제되었습니다.<br>
            주소를 다시 확인하시거나 메인 홈에서 유익한 건강 정보를 만나보세요.
        </p>
        <a href="/" class="btn-home">꿀단지 홈으로 이동</a>
    </div>
</body>
</html>
