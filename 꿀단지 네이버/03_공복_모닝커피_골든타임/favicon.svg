<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- 🍯 황금 꿀단지 항아리 (투명 배경 순수 벡터) -->
  <path d="M20 22 C16 27 15 35 17 43 C19 50 25 54 32 54 C39 54 45 50 47 43 C49 35 48 27 44 22 Z" 
        fill="url(#potGrad)" stroke="#451a03" stroke-width="2" stroke-linejoin="round" />

  <!-- 항아리 입구 -->
  <ellipse cx="32" cy="22" rx="13" ry="3.6" fill="#b45309" stroke="#451a03" stroke-width="2" />
  <ellipse cx="32" cy="21" rx="10.5" ry="2.4" fill="#d97706" />

  <!-- 흘러내리는 황금 꿀방울 -->
  <path d="M32 24 C28 29 26 35 26 39 C26 44 28.5 47 32 47 C35.5 47 38 44 38 39 C38 35 36 29 32 24 Z" 
        fill="url(#honeyGrad)" stroke="#b45309" stroke-width="1.2" />
  
  <!-- 꿀방울 입체 광택 -->
  <ellipse cx="29.5" cy="37" rx="1.8" ry="3.5" fill="#ffffff" opacity="0.85" transform="rotate(-25 29.5 37)" />
  <circle cx="34.5" cy="42" r="1.3" fill="#ffffff" opacity="0.7" />

  <!-- 싱그러운 초록 잎사귀 -->
  <path d="M42 45 C47 44 52 40 53 33 C46 34 42 38 42 45 Z" 
        fill="url(#leafGrad)" stroke="#065f46" stroke-width="1.2" stroke-linejoin="round" />
  <path d="M42 45 C46 41 49 37 53 33" stroke="#a7f3d0" stroke-width="0.8" stroke-linecap="round" />
</svg>